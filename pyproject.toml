[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cayman-procedure-assistant"
version = "1.0.0"
description = "Evidence-grounded conversational assistant for eleven supplied branch procedures"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4==4.13.4", "numpy==2.2.6", "scikit-learn==1.7.1",
  "sentence-transformers==5.3.0", "transformers==4.47.1", "torch==2.7.1",
  "streamlit==1.35.0", "sentencepiece==0.2.1", "huggingface-hub==0.33.4",
  "llama-cpp-python==0.3.36",
]

[project.optional-dependencies]
dev = ["pytest==8.2.0", "pypdf==7.0.0", "pymupdf==1.28.2", "python-pptx==1.0.2", "playwright==1.56.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

