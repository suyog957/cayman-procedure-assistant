[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cayman-procedure-assistant"
version = "2.0.0"
description = "Evidence-grounded conversational assistant for eleven supplied branch procedures"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4==4.13.4", "numpy==2.2.6", "scikit-learn==1.7.1",
  "sentence-transformers==5.3.0", "transformers==4.47.1", "torch==2.7.1",
  "streamlit==1.35.0", "sentencepiece==0.2.1", "huggingface-hub==0.33.4",
  "llama-cpp-python==0.3.36",
]

[project.optional-dependencies]
dev = ["pytest==8.2.0", "pypdf==7.0.0", "pymupdf==1.28.2", "python-pptx==1.0.2", "playwright==1.56.0", "ruff==0.12.4"]
presentation = ["pywin32==312; sys_platform == 'win32'"]
demo = ["kokoro-onnx==0.6.1", "soundfile==0.13.1", "onnxruntime==1.23.2", "phonemizer==3.6.0", "espeakng-loader==0.2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Direct entry points add the local src directory before importing the package.
[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]

